apply plugin: 'com.android.application'

android {
    namespace 'com.weekflow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.weekflow.app"
        minSdk 24          // Android 7.0，覆盖绝大多数在役机型
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("weekflow-release.keystore")
            storePassword "weekflow123"
            keyAlias "weekflow"
            keyPassword "weekflow123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 仅一个依赖：AppCompat（提供 AppCompatActivity / NoActionBar 主题）
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
